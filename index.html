<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Tic-Tac-Toe</h1>
    <div id="game-display">
        <div id="score-container">
            <div id="player-score">Player: 0</div>
            <div id="comp-score">Computer: 0</div>
        </div>
        <div id="board-container">
            <div class="square" data-pos="0,0"></div>
            <div class="square" data-pos="0,1"></div>
            <div class="square" data-pos="0,2"></div>
            <div class="square" data-pos="1,0"></div>
            <div class="square" data-pos="1,1"></div>
            <div class="square" data-pos="1,2"></div>
            <div class="square" data-pos="2,0"></div>
            <div class="square" data-pos="2,1"></div>
            <div class="square" data-pos="2,2"></div>
        </div>
    </div>
    <button type="button" id="play-game">Play Game</button>
</body>
</html>
